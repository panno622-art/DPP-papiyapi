<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thai Street Food Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@900&family=Prompt:wght@300;600&display=swap" rel="stylesheet">
<style>
:root{--y:#f5c800;--b:#0a0905;--w:#f5f0e8;--e:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--b);color:var(--w);font-family:"Prompt",sans-serif}
 
/* Intro */
#intro{position:fixed;inset:0;z-index:9;background:var(--b);display:grid;place-items:center;text-align:center;gap:12px;transition:opacity .8s,transform .8s var(--e)}
#intro.done{opacity:0;transform:translateY(-8px);pointer-events:none}
.il{font-family:"Noto Serif Thai",serif;overflow:hidden}
.il span{display:block;transform:translateY(110%);transition:transform .9s var(--e)}
#intro.go .il span{transform:none}
.il:nth-child(1){font-size:clamp(1.8rem,5vw,4rem);font-weight:900}
.il:nth-child(2){font-size:clamp(3rem,9vw,7rem);font-weight:900;color:var(--y);line-height:1}
.il:nth-child(1) span{transition-delay:.1s}
.il:nth-child(2) span{transition-delay:.3s}
.il:nth-child(3) span{transition-delay:.5s;color:rgba(245,200,0,.5);font-size:clamp(.8rem,2vw,1rem);letter-spacing:.3em}
#bar{width:0;height:2px;background:var(--y);transition:width 1.6s var(--e) .6s;margin:24px auto 0}
#intro.go #bar{width:200px}
 
/* Main */
#site{height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse 60% 50% at 50%,rgba(245,200,0,.07),transparent 70%)}
.title{text-align:center}
.title small{display:block;letter-spacing:.3em;color:rgba(245,240,232,.4);font-size:clamp(.75rem,1.8vw,1rem);margin-bottom:14px}
.title h1{font-family:"Noto Serif Thai",serif;font-size:clamp(3rem,10vw,8rem);font-weight:900;color:var(--y);line-height:1.05;text-shadow:0 0 80px rgba(245,200,0,.3)}
.title hr{width:50px;border:none;border-top:1px solid var(--y);margin:18px auto;opacity:.5}
.title p{letter-spacing:.15em;color:rgba(245,240,232,.35);font-size:clamp(.75rem,1.5vw,.95rem)}
 
/* Button + Dropdown */
.wrap{position:relative;margin-top:44px;text-align:center}
#btn{background:none;border:1px solid var(--y);color:var(--y);padding:14px 52px;font:600 .95rem/"Prompt" sans-serif;letter-spacing:.15em;cursor:pointer;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);transition:background .3s,color .3s}
#btn:hover,#btn.on{background:var(--y);color:var(--b)}
#drop{position:absolute;left:50%;transform:translateX(-50%);width:260px;background:var(--b);border:1px solid rgba(245,200,0,.35);border-top:0;overflow:hidden;max-height:0;transition:max-height .45s var(--e);clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,10px 100%)}
#drop.on{max-height:400px}
#drop a{display:block;padding:13px 22px;color:rgba(245,240,232,.65);text-decoration:none;border-bottom:1px solid rgba(245,200,0,.07);transition:background .2s,color .2s,padding-left .2s;font-size:.9rem}
#drop a:last-child{border:none}
#drop a:hover{background:rgba(245,200,0,.08);color:var(--y);padding-left:30px}
 
/* มุมตกแต่ง */
.c{position:absolute;width:50px;height:50px;opacity:.25;border-color:var(--y);border-style:solid}
.c.tl{top:28px;left:28px;border-width:1px 0 0 1px}
.c.tr{top:28px;right:28px;border-width:1px 1px 0 0}
.c.bl{bottom:28px;left:28px;border-width:0 0 1px 1px}
.c.br{bottom:28px;right:28px;border-width:0 1px 1px 0}
 
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
 
<div id="intro">
  <div class="il"><span>ยินดีต้อนรับสู่</span></div>
  <div class="il"><span>Thai Street Food</span></div>
  <div class="il"><span>GUIDE</span></div>
  <div id="bar"></div>
</div>
 
<div id="site">
  <div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>
  <div>
    <div class="title">
      <small>DISCOVER THE TASTE OF THAILAND</small>
      <h1>Thai Street<br>Food Guide</h1>
      <hr>
      <p>คู่มืออาหารริมทางจากทั่วทุกภูมิภาค</p>
    </div>
    <div class="wrap">
      <button id="btn">เข้าสู่เว็บไซต์ ▾</button>
      <div id="drop">
        <!-- เพิ่ม/ลบ/เปลี่ยน href ได้เลย -->
        <a href="home.html">🏠 หน้าแรก</a>
      </div>
    </div>
  </div>
</div>
 
<script>
// Intro: เล่นทันทีที่โหลด → รอ 2.8s → เลือนหาย → ปลดล็อกหน้า
const intro=document.getElementById('intro');
requestAnimationFrame(()=>requestAnimationFrame(()=>intro.classList.add('go')));
setTimeout(()=>{intro.classList.add('done');document.body.style.overflow=''},2800);
 
// Dropdown
const btn=document.getElementById('btn'),drop=document.getElementById('drop');
btn.onclick=()=>[btn,drop].forEach(x=>x.classList.toggle('on'));
document.addEventListener('click',e=>!btn.contains(e.target)&&[btn,drop].forEach(x=>x.classList.remove('on')));


</script>
</body>
</html>
